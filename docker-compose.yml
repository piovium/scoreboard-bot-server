services:
  app:
    build: .
    container_name: render-middleware
    ports:
      - '${PORT:-3000}:3000'
    environment:
      - PORT=${PORT:-3000}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - TZ=${TZ:-Asia/Shanghai}
      - PASSPORT_API_URL=${PASSPORT_API_URL:-https://passport-api.mihoyo.com}
      - BIZ_API_URL=${BIZ_API_URL:-https://api-takumi.mihoyo.com}
      - GAME_API_URL=${GAME_API_URL:-https://hk4e-api.mihoyo.com}
      - RPC_APP_ID=${RPC_APP_ID:-cie2gjc0sg00}
      - RPC_CLIENT_TYPE=${RPC_CLIENT_TYPE:-4}
      - RPC_GAME_BIZ=${RPC_GAME_BIZ:-hk4e_cn}
      - RPC_SDK_VERSION=${RPC_SDK_VERSION:-2.53.1}
      - DEVICE_NAME=${DEVICE_NAME:-Chrome}
      - DEVICE_MODEL=${DEVICE_MODEL:-Chrome 149.0.0.0}
      - DEVICE_OS=${DEVICE_OS:-Windows 10 64-bit}
      - REDIS_URL=redis://redis:6379/0
      - CHROMIUM_WS_ENDPOINT=http://chromium:9222
      - SESSION_TTL=${SESSION_TTL:-300}
      - COOKIE_TTL=${COOKIE_TTL:-86400}
    depends_on:
      redis:
        condition: service_healthy
      chromium:
        condition: service_started
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    environment:
      - TZ=${TZ:-Asia/Shanghai}
    container_name: render-middleware-redis
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  chromium:
    build:
      context: .
      dockerfile: Dockerfile.chromium
    image: dyebleach-chromium:latest
    container_name: render-middleware-chromium
    environment:
      - TZ=${TZ:-Asia/Shanghai}
    command:
      - --no-sandbox
      - --disable-gpu
      - --disable-dev-shm-usage
    restart: unless-stopped

volumes:
  redis_data:
